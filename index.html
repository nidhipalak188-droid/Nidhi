<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 15px; background: #1e1e1e; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; }
    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; }
    .user { background-color: #007bff; align-self: flex-end; }
    .ai { background-color: #2a2a2a; align-self: flex-start; }
    #input-container { padding: 12px; background: #1e1e1e; display: flex; gap: 8px; border-top: 1px solid #333; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; outline: none; }
    button { padding: 12px 18px; border-radius: 8px; border: none; background-color: #007bff; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <header>⚡ Nova AI Assistant</header>

  <div id="chat-box">
    <div class="message ai">Hello! I am Nova AI powered by Google Gemini. Ask me anything in the world!</div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Ask me anything..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    // PASTE YOUR API KEY BETWEEN THE QUOTES BELOW:
    const API_KEY = "YOUR_API_KEY_HERE";

    async function sendMessage() {
      const inputField = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const messageText = inputField.value.trim();

      if (messageText === '') return;

      // Display User Message
      const userMessage = document.createElement('div');
      userMessage.className = 'message user';
      userMessage.textContent = messageText;
      chatBox.appendChild(userMessage);

      inputField.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Show thinking message
      const aiMessage = document.createElement('div');
      aiMessage.className = 'message ai';
      aiMessage.textContent = "Thinking...";
      chatBox.appendChild(aiMessage);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (API_KEY === "AQ.Ab8RN6Lm6J4miKOh7MI5wGy61laJcPc_y87S6Ah0-pNXSm_znw") {
        aiMessage.textContent = "Please replace YOUR_API_KEY_HERE in index.html with your actual Gemini API key!";
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: messageText }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          aiMessage.textContent = data.candidates[0].content.parts[0].text;
        } else {
          aiMessage.textContent = "Sorry, I couldn't process that question. Please check your API key.";
        }
      } catch (error) {
        aiMessage.textContent = "Error connecting to AI. Please try again.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
